[project]
name = "haldio"
version = "0.1.0"
description = "PDF to audiobook converter with a local editor LLM and local TTS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "jinja2>=3.1",
    "num2words>=0.5.14",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pymupdf>=2.1",
    "pymupdf4llm>=2.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
    "reportlab>=5.1",
    "playwright>=1.65",
]
# TTS worker environment (torch stays out of the web server environment).
tts = [
    "qwen-tts>=0.1",
    "soundfile>=0.12",
    "huggingface_hub>=0.24",
    "torch>=2.7",
]

[project.scripts]
haldio = "haldio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/haldio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not live_tts'"
markers = [
    "live: needs a real LM Studio / TTS server",
    "live_tts: needs the real Qwen3-TTS model (haldio tts-pull first)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
