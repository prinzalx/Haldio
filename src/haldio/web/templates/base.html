<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Haldio{% endblock %}</title>
  <script>
  // theme before first paint: saved choice wins, else the system preference
  (function () {
    try {
      var t = localStorage.getItem("haldio-theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (err) {}
  })();
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/htmx.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">🎧 Haldio</a>
    <a href="/">📚 Bücherei</a>
    <a href="/settings">⚙️ Einstellungen</a>
    <button id="theme-switch" class="secondary" aria-label="Farbthema wechseln">🌙</button>
    <span class="ver">v{{ version | default('dev') }}</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
  const toastBox = document.getElementById("toast");
  let toastTimer = null;
  function showToast(message) {
    toastBox.textContent = message;
    toastBox.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastBox.classList.remove("show"), 2000);
  }
  const themeSwitch = document.getElementById("theme-switch");
  const themeIsDark = () => (document.documentElement.dataset.theme
    || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")) === "dark";
  themeSwitch.textContent = themeIsDark() ? "☀️" : "🌙";
  themeSwitch.addEventListener("click", () => {
    const root = document.documentElement;
    const next = themeIsDark() ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("haldio-theme", next); } catch (err) {}
    themeSwitch.textContent = next === "dark" ? "☀️" : "🌙";
  });
  // the log <details> keeps its open/closed state across any swap
  document.addEventListener("toggle", (e) => {
    const d = e.target;
    if (d.matches && d.matches("details[data-log]")) {
      try { localStorage.setItem("haldio-log-" + d.dataset.log, d.open ? "open" : "closed"); } catch (err) {}
    }
  }, true);
  document.addEventListener("htmx:afterSwap", () => {
    document.querySelectorAll("details[data-log]").forEach((d) => {
      let saved = null;
      try { saved = localStorage.getItem("haldio-log-" + d.dataset.log); } catch (err) {}
      if (saved !== null) d.open = saved === "open";
    });
  });
  // HTMX form saves answer with a polite toast
  document.addEventListener("htmx:afterRequest", (e) => {
    const t = e.target;
    if (t.matches && t.matches("form[hx-post]") && e.detail.successful) showToast("Gespeichert");
  });
  // "Technische Details": new lines arrive by polling, but only while the box is open
  (function () {
    const box = document.querySelector("details[data-log-src]");
    if (!box) return;
    const lines = box.querySelector("[data-log-lines]");
    const counter = box.querySelector("[data-log-count]");
    let count = parseInt(box.dataset.logTotal || "0", 10);
    setInterval(async () => {
      if (!box.open) return;
      try {
        const res = await fetch(box.dataset.logSrc + "?after=" + count);
        if (!res.ok) return;
        const data = await res.json();
        if (!data.lines.length) return;
        for (const line of data.lines) {
          const span = document.createElement("span");
          span.className = line.includes("[ERROR]") ? "log-err"
                         : line.includes("[WARN]") ? "log-warn" : "";
          span.textContent = line + "\n";
          lines.appendChild(span);
        }
        count = data.count;
        counter.textContent = String(count);
        const holder = lines.parentElement;
        holder.scrollTop = holder.scrollHeight;
      } catch (err) {}
    }, 2000);
  })();
  // upload card: chosen file name + size, drag & drop, disable button while uploading
  (function () {
    const input = document.getElementById("file");
    const info = document.getElementById("file-info");
    if (!input || !info) return;
    const show = () => {
      const f = input.files[0];
      info.textContent = f ? f.name + " (" + Math.round(f.size / 1024) + " kB)"
                           : "PDF hierher ziehen oder Datei wählen";
    };
    input.addEventListener("change", show);
    const zone = document.getElementById("dropzone");
    zone.addEventListener("dragover", (e) => { e.preventDefault(); zone.classList.add("hover"); });
    zone.addEventListener("dragleave", () => zone.classList.remove("hover"));
    zone.addEventListener("drop", (e) => {
      e.preventDefault(); zone.classList.remove("hover");
      if (e.dataTransfer.files.length) { input.files = e.dataTransfer.files; show(); }
    });
    document.getElementById("upload-form").addEventListener("submit", () => {
      document.getElementById("upload-btn").disabled = true;
    });
  })();
  </script>
</body>
</html>
