# Copy to config.yaml and adjust. config.yaml is ignored by git.
llm:
  base_url: http://127.0.0.1:8080/v1
  api_key: lm-studio
  model: bubo
  temperature: 0.2
  max_input_tokens: 1500
  max_output_tokens: 4000
  timeout_s: 600
  strip_thinking: true
tts:
  backend: mock          # mock | qwen3
  base_url: http://127.0.0.1:1234/v1
  api_key: ""
  voice: ""
  language: auto
  max_chars_per_unit: 400
editor:
  prompt_version: v1
  fidelity_check: true
  max_retries: 2
  review_before_tts: false
policies:              # see docs/BRIEF.md section 8.5
  table_max_cells: 40
  code: announce
  footnotes: after_paragraph
  toc: skip
  index: skip
  bibliography: announce
  urls: speak_short
audio:
  formats: [mp3, ogg]
  mp3_bitrate_kbps: 96
  channels: 1
  target_lufs: -18
  pause_ms: {paragraph: 500, heading: 900, chapter: 1500}
paths:
  data_dir: ./data
hooks:
  before_stage_command: ""
  after_stage_command: ""
server:
  host: 127.0.0.1
  port: 8505             # 8080 is used by the LLM on this machine
  max_upload_mb: 100
