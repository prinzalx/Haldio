# Copy to config.yaml and adjust. config.yaml is ignored by git.
llm:
  base_url: http://127.0.0.1:8080/v1
  api_key: lm-studio
  model: bubo
  temperature: 0.2
  max_input_tokens: 1500
  max_output_tokens: 4000
  timeout_s: 600
  strip_thinking: true
tts:
  backend: mock          # mock | qwencpp | qwen_local (deprecated)
  mode: custom_voice     # custom_voice | clone (clone = qwen_local only)
  model_id: Qwen/Qwen3-TTS-12Hz-1.7B-CustomVoice
  model_path: ""         # optional local folder (qwen_local only)
  worker_python: ""      # empty = same interpreter (qwen_local only)
  device: auto           # auto | cuda:0 | cpu (qwen_local only)
  dtype: bfloat16
  language: auto
  speaker: ""            # custom_voice only
  instruct: ""           # custom_voice only
  reference_audio: ""    # clone only, file in voices/
  reference_text: ""     # clone only, if the API needs it
  max_chars_per_unit: 400
  batch_size: 1
  confirm_before_start: true   # web jobs pause before TTS until you confirm
  qwencpp_server: "../_tools/qwentts.cpp/build/Release/tts-server.exe"
  qwencpp_model: "../_tools/qwentts.cpp/models/qwen-talker-1.7b-customvoice-Q8_0.gguf"
  qwencpp_codec: "../_tools/qwentts.cpp/models/qwen-tokenizer-12hz-Q8_0.gguf"
  qwencpp_device: ""     # empty = server default (best device); e.g. Vulkan0
  qwencpp_port: 8111     # 8080 is used by LM Studio on this machine
  qwencpp_startup_timeout: 300
editor:
  prompt_version: v1
  fidelity_check: true
  max_retries: 2
  review_before_tts: false
policies:              # see docs/BRIEF.md section 8.5
  table_max_cells: 40
  code: announce
  footnotes: after_paragraph
  toc: skip
  index: skip
  bibliography: announce
  urls: speak_short
audio:
  formats: [mp3, ogg]
  mp3_bitrate_kbps: 96
  channels: 1
  target_lufs: -18
  pause_ms: {paragraph: 500, heading: 900, chapter: 1500}
paths:
  data_dir: ./data
hooks:
  before_edit: ""
  after_edit: ""
  before_speak: ""       # optional shell command around a stage
  after_speak: ""
server:
  host: 127.0.0.1
  port: 8505             # 8080 is used by the LLM on this machine
  max_upload_mb: 100
